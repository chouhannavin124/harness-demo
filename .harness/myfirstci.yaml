pipeline:
  name: my-first-ci
  identifier: myfirstci
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: <+input>
        build:
          type: branch
          spec:
            branch: main
  variables:
    - name: IMAGE_REPO
      type: String
      value: <+input>
    - name: NODE_VERSION
      type: String
      value: <+input>
  stages:
    - stage:
        name: canvas
        identifier: canvas
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: install-and-test
                  identifier: installandtest
                  spec:
                    failureStrategies:
                      - onFailure:
                          errors:
                            - AllErrors
                          action:
                            type: Retry
                            spec:
                              retryCount: 2
                              retryIntervals:
                                - 10s
                              onRetryFailure:
                                action:
                                  type: Abort
                    connectorRef: account.harnessImage
                    image: node:<+pipeline.variables.NODE_VERSION>-alpine
                    shell: Sh
                    command: |-
                      echo "Installing dependencies..."
                      npm install
                      echo "Running tests..."
                      npm test
              - step:
                  type: Run
                  name: lint-check
                  identifier: lintcheck
                  spec:
                    connectorRef: account.harnessImage
                    image: node:<+pipeline.variables.NODE_VERSION>-alpine
                    shell: Sh
                    command: |-
                      echo "Running lint checks..."
                      echo "Lint passed"
    - stage:
        name: push-image
        identifier: pushimage
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: trivy-scan
                  identifier: trivyscan
                  spec:
                    connectorRef: account.harnessImage
                    image: aquasec/trivy:latest
                    shell: Sh
                    command: |-
                      echo "Running Trivy security scan..."
                      trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress node:<+pipeline.variables.NODE_VERSION>-alpine
                      echo "Trivy scan complete"
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
              - step:
                  type: BuildAndPushDockerRegistry
                  name: push-to-github
                  identifier: pushtogithub
                  spec:
                    connectorRef: <+input>
                    repo: <+pipeline.variables.IMAGE_REPO>
                    tags:
                      - latest